# Deploys every push to main to Vercel production, whoever pushed it.
# (Vercel's Hobby plan blocks Git deploys of commits by people other than the
# account owner; deploying with the owner's token from CI avoids that.)
# Needs repo secrets VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID (see CLAUDE.md).
name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch: # "Run workflow" button for a manual redeploy

concurrency:
  group: vercel-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      HAS_TOKEN: ${{ secrets.VERCEL_TOKEN != '' }}
    steps:
      - name: Secrets missing
        if: env.HAS_TOKEN != 'true'
        run: echo "::warning::VERCEL_TOKEN / VERCEL_ORG_ID / VERCEL_PROJECT_ID not set; skipping deploy."
      - uses: actions/checkout@v4
        if: env.HAS_TOKEN == 'true'
      - uses: actions/setup-node@v4
        if: env.HAS_TOKEN == 'true'
        with:
          node-version: 24
      - name: Install Vercel CLI
        if: env.HAS_TOKEN == 'true'
        run: npm install --global vercel@latest
      - name: Pull project settings (root directory = web)
        if: env.HAS_TOKEN == 'true'
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - name: Build
        if: env.HAS_TOKEN == 'true'
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
      - name: Deploy
        if: env.HAS_TOKEN == 'true'
        # Drop the git metadata first: Vercel blocks a deploy whose commit author isn't on the
        # Hobby team, even with the owner's token. Without .git it's just the owner deploying.
        run: |
          rm -rf .git
          vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
